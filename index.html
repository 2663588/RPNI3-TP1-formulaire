<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Oxfam Canada - FournierMichael_TP1_formulaire</title>
</head>





<body class="bg-gray-100 p-4 md:p-8 min-h-screen">

  <div id="app"></div>



  <!-- PREMIÈRE PAGE -->
  <form class="max-w-xl mx-auto bg-white border rounded-lg shadow-lg p-4 space-y-4">

    <header class="flex items-center gap-4">
      <img src="/favicon.svg" alt="Oxfam Canada" class="w-16 h-auto">
      <h1 class="font-bold italic text-2xl">Oxfam — Faire un don</h1>
    </header>

    <nav aria-label="Étapes du don">
      <ol class="flex justify-between italic font-light text-sm">
        <li><button type="button" data-cible-etape="1">1. TYPE ET MONTANT</button></li>
        <li><button type="button" data-cible-etape="2">2. COORDONNÉES</button></li>
        <li><button type="button" data-cible-etape="3">3. PAIEMENT</button></li>
        <li><button type="button" data-cible-etape="4">4. CONFIRMATION</button></li>

      </ol>
      <div class="w-full bg-white-200 h-2 rounded border-2 border-black overflow-hidden" role="progressbar"
        aria-valuenow="1" aria-valuemin="0" aria-valuemax="4" aria-label="Progression du formulaire">
        <div class="h-full bg-green-800 h-2 rounded" style="width: 25%;"></div>
    </nav>


    <fieldset data-etape="1" class="space-y-4">

      <legend class="font-bold text-2xl">Étape 1 — Type et montant du don</legend>


      <fieldset class="grid grid-cols-2 gap-2">
        <legend class="font-bold">Type de don</legend>
        <div class="flex items-center gap-2">
          <input type="radio" id="don-unique" name="type-don" value="unique" required>
          <label for="don-unique">Don unique</label>
        </div>

        <div class="flex items-center gap-2">
          <input type="radio" id="don-mensuel" name="type-don" value="mensuel">
          <label for="don-mensuel">Don mensuel</label>
        </div>
      </fieldset>


      <!-- 50$ montant -->
      <legend class="font-bold">Montant du don</legend>
      <fieldset class="grid grid-cols-2 gap-2">
        <legend class="sr-only">Montant du don</legend>
        <div>
          <input type="radio" id="montant-50" name="montant" value="50" class="peer sr-only">
          <label for="montant-50"
            class="block border rounded p-4 text-center cursor-pointer peer-checked:bg-green-800 peer-checked:text-white">50
            $</label>
        </div>

        <!-- 100$ montant -->
        <div><input type="radio" id="montant-100" name="montant" value="100" class="peer sr-only">
          <label for="montant-100"
            class="block border rounded p-4 text-center cursor-pointer peer-checked:bg-green-800 peer-checked:text-white">100
            $</label> </div>

        <!-- 250$ montant -->
        <div>
          <input type="radio" id="montant-250" name="montant" value="250" class="peer sr-only">
          <label for="montant-250"
            class="block border rounded p-4 text-center cursor-pointer peer-checked:bg-green-800 peer-checked:text-white">250
            $</label>
        </div>

        <!-- 500$ montant -->
        <div> <input type="radio" id="montant-500" name="montant" value="500" class="peer sr-only">
          <label for="montant-500"
            class="block border rounded p-4 text-center cursor-pointer peer-checked:bg-green-800 peer-checked:text-white">500
            $</label>
        </div>

        <div class="col-span-2">
          <label for="autre-montant-valeur" class="sr-only">Autre montant</label>
          <input type="number" id="autre-montant-valeur" name="montant-autre-valeur" min="5" max="1000000000" step="1"
            placeholder="Autre montant"
            class="block w-full border rounded p-4 text-center cursor-pointer focus:bg-green-800 focus:text-white focus:placeholder-white col-span-2">
        </div>



        <button type="button" id="continuer1"
          class="w-full bg-green-800 hover:bg-green-900 text-white font-bold py-3 rounded col-span-2">Continuer</button>


      </fieldset>

    </fieldset>

  </form>
  <!-- DEUXIÈME PAGE -->
  <form>
<legend class="font-bold text-2xl">Étape 2 — Informations de contact</legend>
    <fieldset data-etape="2">
      
      
      </div>



    </fieldset>
  </form>
  <!-- TROISIÈME PAGE -->
  <form>
<legend class="font-bold text-2xl">Étape 3 — Informations de paiement</legend>
    <fieldset data-etape="3">
      
    
    </fieldset>

  </form>


  <!-- QUATRIÈME PAGE -->
  <form>
    <legend class="font-bold text-2xl">Étape 4 — Confirmation</legend>

    <fieldset data-etape="4">
     
    </fieldset>

  </form>




  <script type="module" src="/src/main.ts"></script>
</body>

</html>
